# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 500  # [Hz] Can Frequency

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


    allegro_effort_controller:
      type: allegro_hand_computed_torque/ComputedTorque_Controller

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_0_0
      - joint_1_0
      - joint_2_0
      - joint_3_0
      - joint_4_0
      - joint_5_0
      - joint_6_0
      - joint_7_0
      - joint_8_0
      - joint_9_0
      - joint_10_0
      - joint_11_0
      - joint_12_0
      - joint_13_0
      - joint_14_0
      - joint_15_0

allegro_effort_controller:
  ros__parameters:
    joints:
      - joint_0_0
      - joint_1_0
      - joint_2_0
      - joint_3_0
      - joint_4_0
      - joint_5_0
      - joint_6_0
      - joint_7_0
      - joint_8_0
      - joint_9_0
      - joint_10_0
      - joint_11_0
      - joint_12_0
      - joint_13_0
      - joint_14_0
      - joint_15_0
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
    # --- Controller parameters --- #
    kp1: 1.0    #default: 120.0
    kp2: 1.0    #default: 70.0
    kp3: 1.0    #default: 50.0
    kd1: 0.4
    kd2: 0.15
    kd3: 0.4
