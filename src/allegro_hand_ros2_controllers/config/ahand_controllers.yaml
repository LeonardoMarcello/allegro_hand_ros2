# This is a template for setting the effort Controller.
# The running controller is defined in allegro_hasand_bringup package

computed_torque_controller:
    type: ahand_controllers/ComputedTorque_Controller
    joints:
      - joint_0_0
      - joint_1_0
      - joint_2_0
      - joint_3_0
      - joint_4_0
      - joint_5_0
      - joint_6_0
      - joint_7_0
      - joint_8_0
      - joint_9_0
      - joint_10_0
      - joint_11_0
      - joint_12_0
      - joint_13_0
      - joint_14_0
      - joint_15_0
    # --- Controller parameters --- #
    # kp1: 1.0
    # kp2: 1.0
    # kp3: 1.0
    # kp4: 1.0
    # kd1: 0.04
    # kd2: 0.15
    # kd3: 0.04
    # kd4: 0.04
    gains:
      finger:
        kp: [1.0, 1.0, 1.0, 1.0]
        kd: [0.04, 0.15, 0.04, 0.04]
      thumb:
        kp: [1.0, 1.0, 1.0, 1.0]
        kd: [0.04, 0.15, 0.04, 0.04]

    # PD:
    #   Kp = [1, 1, 1, 1];
    #   Kd = [0.04, 0.15, 0.04, 0.04];
